<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keuangan Kos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-4">
        <h2 class="text-primary fw-bold mb-4">Catat Transaksi Baru</h2>
        <div class="card shadow-sm mb-5">
            <div class="card-body">

                <!-- Tampilan Sisa Saldo -->
        <div class="card bg-success text-white shadow-sm mb-4">
            <div class="card-body text-center">
                <h5 class="mb-1">Sisa Jatah Bulan Ini</h5>
                <h2 class="fw-bold mb-0" id="teks-saldo">Rp 0</h2>
            </div>
        </div>

    <form id="formTransaksi">
        <label class="form-label">Kategori:</label>
        <select id="input-kategori" class="from-select" required>
        <option value="">-- Pilih Kategori --</option>

    <!-- Opsi kategori akan disuntikkan otomatis oleh JavaScript -->
</select>
        <br><br>

        <label>Nominal Pengeluaran (Rp):</label>
        <input type="number" id="inputNominal" class="form-control" placeholder="Contoh: 15000" required>
        <br><br>

        <label>Catatan (Opsional):</label>
        <input type="text" id="inputCatatan" class="form-control" placeholder="Contoh: Beli Nescafe & madu">
        <br><br>

        <button type="submit" class="btn btn-primary mt-3">Simpan Transaksi</button>
    </form>
        </div>
            </div>

    <hr>
    <h3>Riwayat Jajan</h3>
<table class="table table-bordered table-hover shadow-sm">
    <thead class="table-dark">
        <tr>
            <th>Tanggal</th>
            <th>Catatan</th>
            <th>Nominal</th>
        </tr>
    </thead >
    <tbody id="tabel-riwayat">
    <!-- Data dari database akan otomatis disuntikkan ke sini -->
</tbody>
</table>

    <script src="script.js"></script>
</body>
</html>
